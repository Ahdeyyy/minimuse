name: Build and release MiniMuse

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  build:
    name: Check and build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux/amd64
          - name: Linux ARM64
            os: ubuntu-latest
            platform: linux/arm64
          - name: macOS universal
            os: macos-latest
            platform: darwin/universal
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Vet Go and MyGo UI lifetimes
        run: go tool mygo vet .

      - name: Build versioned executable and packages
        id: package
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/build-release.ps1 -BuildNumber $env:GITHUB_RUN_NUMBER -Platform $env:BUILD_PLATFORM

      - name: Save release files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    # A merged PR pushes to master; publishing here avoids duplicate releases.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: MiniMuse-v${{ needs.build.outputs.version }}-*
          merge-multiple: true
          path: release

      - name: Create release for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --target "$RELEASE_COMMIT" \
            --title "MiniMuse v$RELEASE_VERSION" \
            --generate-notes
